# SEC545 AI security harness configuration
# provider: claude_cli  -> headless Claude Code (uses your Claude Code login; no API key)
#           anthropic_api -> Anthropic Python SDK (needs ANTHROPIC_API_KEY)
#           databricks    -> Databricks Model Serving / Unity Gateway (profiles may override per profile)
provider: claude_cli

# Benchmark runs keep going when one model session fails; the failure is recorded in
# calls.jsonl and the affected items fall back to needs_review / no result (scored as misses).
tolerate_call_failures: false

_bench: &bench           # identical limits for every benchmark model; only the model varies
  discovery_passes: 1
  max_turns: 40
  max_budget_usd: 8.00      # used by claude_cli/anthropic_api; databricks uses max_session_tokens
  live_validation: false    # static code-based validation only: no app, no PoC execution
  tolerate_call_failures: true

profiles:
  cheap:            # default: as cheap as possible (Haiku/Sonnet only, single discovery pass)
    triage: haiku
    discovery: sonnet
    validation: sonnet
    attack_path: sonnet
    discovery_passes: 1
    max_turns: 40           # per phase session (claude_cli)
    max_budget_usd: 3.00    # per phase session (claude_cli)
  showcase:         # for the live class run if you want stronger results
    triage: sonnet
    discovery: opus
    validation: opus
    attack_path: opus
    discovery_passes: 2
    max_turns: 80
    max_budget_usd: 10.00
  opus:             # model-comparison run: identical to `cheap` but all-Opus (only the model varies)
    triage: opus
    discovery: opus
    validation: opus
    attack_path: opus
    discovery_passes: 1
    max_turns: 40
    max_budget_usd: 8.00

  # ---- 15-model Databricks benchmark (same harness, same inputs, static validation) ----
  db-opus-5-5:
    provider: databricks
    triage: db-opus-5-5
    discovery: db-opus-5-5
    validation: db-opus-5-5
    attack_path: db-opus-5-5
    <<: *bench
  db-haiku-5-5:
    provider: databricks
    triage: db-haiku-5-5
    discovery: db-haiku-5-5
    validation: db-haiku-5-5
    attack_path: db-haiku-5-5
    <<: *bench
  db-gpt-6-2-sol:
    provider: databricks
    triage: db-gpt-6-2-sol
    discovery: db-gpt-6-2-sol
    validation: db-gpt-6-2-sol
    attack_path: db-gpt-6-2-sol
    <<: *bench
  db-gpt-oss-120b:
    provider: databricks
    triage: db-gpt-oss-120b
    discovery: db-gpt-oss-120b
    validation: db-gpt-oss-120b
    attack_path: db-gpt-oss-120b
    <<: *bench
  db-gemini-4-argon:
    provider: databricks
    triage: db-gemini-4-argon
    discovery: db-gemini-4-argon
    validation: db-gemini-4-argon
    attack_path: db-gemini-4-argon
    <<: *bench
  db-gemini-3-8-flash:
    provider: databricks
    triage: db-gemini-3-8-flash
    discovery: db-gemini-3-8-flash
    validation: db-gemini-3-8-flash
    attack_path: db-gemini-3-8-flash
    <<: *bench
  db-gemma-3-12b:
    provider: databricks
    triage: db-gemma-3-12b
    discovery: db-gemma-3-12b
    validation: db-gemma-3-12b
    attack_path: db-gemma-3-12b
    <<: *bench
  db-grok-4-7:
    provider: databricks
    triage: db-grok-4-7
    discovery: db-grok-4-7
    validation: db-grok-4-7
    attack_path: db-grok-4-7
    <<: *bench
  db-kimi-k3-1-pro:
    provider: databricks
    triage: db-kimi-k3-1-pro
    discovery: db-kimi-k3-1-pro
    validation: db-kimi-k3-1-pro
    attack_path: db-kimi-k3-1-pro
    <<: *bench
  db-glm-5-3:
    provider: databricks
    triage: db-glm-5-3
    discovery: db-glm-5-3
    validation: db-glm-5-3
    attack_path: db-glm-5-3
    <<: *bench
  db-glm-5-3-flash:
    provider: databricks
    triage: db-glm-5-3-flash
    discovery: db-glm-5-3-flash
    validation: db-glm-5-3-flash
    attack_path: db-glm-5-3-flash
    <<: *bench
  db-qwen35-122b:
    provider: databricks
    triage: db-qwen35-122b
    discovery: db-qwen35-122b
    validation: db-qwen35-122b
    attack_path: db-qwen35-122b
    <<: *bench
  db-qwen3-next-80b:
    provider: databricks
    triage: db-qwen3-next-80b
    discovery: db-qwen3-next-80b
