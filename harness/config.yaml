    triage: db-deepseek-v4-1-flash
    discovery: db-deepseek-v4-1-flash
    validation: db-deepseek-v4-1-flash
    attack_path: db-deepseek-v4-1-flash
    <<: *bench

# model aliases -> exact IDs for the API provider (claude_cli accepts the aliases directly)
models:
  haiku: claude-haiku-5-5
  sonnet: claude-sonnet-5-5
  opus: claude-opus-5-5

# USD per 1M tokens (API provider cost estimate; claude_cli reports its own total_cost_usd)
pricing:
  claude-haiku-5-5: { input: 0.10, output: 0.50 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00 }
  claude-opus-5-5: { input: 4.00, output: 20.00 }

databricks:
  max_output_tokens: 16000
  max_session_tokens: 2000000   # input+output tokens per model session before "return the final JSON now"
  request_timeout_s: 300
  max_retries: 5

# alias -> where/how to call it. endpoint = /serving-endpoints/<name>; gateway = Unity Gateway model service.
# api: chat (default) | responses (needed for GPT-6.x function tools on Databricks)
databricks_models:
  db-opus-5-5: { endpoint: databricks-claude-opus-5-5 }
  db-haiku-5-5: { endpoint: databricks-claude-haiku-5-5 }
  db-gpt-6-2-sol: { gateway: system.ai.gpt-6-2-sol, api: responses }
  db-gpt-oss-120b: { endpoint: databricks-gpt-oss-120b }
  db-gemini-4-argon: { endpoint: databricks-gemini-4-argon }
  db-gemini-3-8-flash: { endpoint: databricks-gemini-3-8-flash }
  db-gemma-3-12b: { endpoint: databricks-gemma-3-12b, max_output_tokens: 8192 }
  db-grok-4-7: { endpoint: databricks-grok-4-7 }
  db-kimi-k3-1-pro: { gateway: system.ai.kimi-k3-1-pro }
  db-glm-5-3: { endpoint: databricks-glm-5-3 }
  db-glm-5-3-flash: { endpoint: databricks-glm-5-3-flash }
  db-qwen35-122b: { endpoint: databricks-qwen35-122b-a10b }
  db-qwen3-next-80b: { endpoint: databricks-qwen3-next-80b-a3b-instruct, max_output_tokens: 8192 }
  db-llama-4-maverick: { endpoint: databricks-llama-4-maverick, max_output_tokens: 8192 }
  db-deepseek-v4-1-flash: { gateway: system.ai.deepseek-v4-1-flash-1017 }

scanners:
  trivy: aquasec/trivy:0.56.2
  semgrep: semgrep/semgrep:1.95.0
  trufflehog: trufflesecurity/trufflehog:3.88.0

validation:
  batch_size: 8
  live: true               # default; a profile can set live_validation: false (static-only)
  reset_app_before: true

apps:
  snackoverflow:
    path: apps/snackoverflow
    base_url: http://localhost:8001
    container: snackoverflow-api-1
    image: sec545/snackoverflow-api:latest
    description: "Food-delivery marketplace (Python/FastAPI). Roles: customer, restaurant_owner, driver, admin."
    login: { method: POST, path: /api/auth/login, body: { email: "{email}", password: "{password}" }, token_json_path: token }
    # pentest-style engagement accounts handed to the AI (low privilege; no admin)
    accounts:
      alice: { email: alice@snack.local, password: alice123, role: customer, note: "user id 1" }
      bob: { email: bob@snack.local, password: bob123, role: customer, note: "user id 2" }
      chef: { email: chef@nullpointer.pizza, password: chef123, role: restaurant_owner, note: "owns restaurants 1, 3, 4" }
      rider: { email: rider@snack.local, password: rider123, role: driver }
  ragnarok:
    path: apps/ragnarok
    base_url: http://localhost:8002
    container: ragnarok-app-1
    image: sec545/ragnarok:latest
    description: "GenAI knowledge assistant (Node/TypeScript/Express) with RAG, a simulated LLM and agent tools. Two tenants (workspaces)."
    login: { method: POST, path: /api/login, body: { email: "{email}", password: "{password}" }, token_json_path: token }
    accounts:
      freya: { email: freya@asgard.local, password: freya123, role: user, note: "workspace 1 (Asgard Inc)" }
      loki: { email: loki@midgard.local, password: loki123, role: user, note: "workspace 2 (Midgard Mutual)" }
