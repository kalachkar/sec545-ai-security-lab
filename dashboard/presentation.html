<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEC545 · AI Security Lab</title>
<style>
:root{--ink:#18283e;--muted:#627187;--line:#dce3eb;--blue:#285ee8;--bg:#f5f7fb;--critical:#b42336;--high:#db5c26;--medium:#b8870a;--low:#3671c5;--unknown:#788596;--info:#728e95}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 'Segoe UI',Arial,sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 18px;color:var(--ink)}button:hover{border-color:var(--blue);background:#f2f6ff}button:disabled{opacity:.4;cursor:default}a{color:var(--blue)}:focus-visible{outline:3px solid #3976ff;outline-offset:3px}header{background:white;border-bottom:1px solid var(--line);padding:18px 4%;display:flex;align-items:center;justify-content:space-between;gap:25px}.brand{font-size:22px;white-space:nowrap}.brand b{color:var(--blue)}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{border-color:transparent;background:transparent}nav button[aria-current=page]{background:#eaf0ff;color:#214fca;font-weight:700}main{max-width:1600px;margin:auto;padding:34px 4% 60px}h1{font-size:40px;line-height:1.2;letter-spacing:-1px;margin:0 0 8px}h2{font-size:26px;line-height:1.3;margin:0 0 8px}h3{font-size:21px;margin:0 0 12px}p{margin:8px 0}.lead{color:var(--muted);font-size:20px;margin-bottom:28px}.muted,small{color:var(--muted)}small{font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.total{font-size:40px;font-weight:750}.stack{display:flex;gap:3px;height:13px;border-radius:4px;overflow:hidden;margin:20px 0}.severitygrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.severitygrid button{padding:10px 3px;border:0;border-radius:6px;background:var(--bg);font-size:14px}.severitygrid strong{display:block;font-size:26px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--color)}.badge{display:inline-block;padding:3px 9px;border-radius:5px;background:#f3f5f8;font-size:14px;color:var(--color);font-weight:650;white-space:nowrap}.section{margin-top:30px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{border:1px solid #cbd5e2;border-radius:7px;background:#fff;padding:10px 12px;max-width:100%;color:var(--ink)}.toolbar input{flex:1;min-width:220px}.tablebox{background:white;border:1px solid var(--line);border-radius:10px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:16px}th{background:#f0f4f9;color:#52627a;font-size:14px;font-weight:650;text-align:left;padding:14px 16px;white-space:nowrap}td{border-top:1px solid var(--line);padding:16px;vertical-align:top}td.title{min-width:280px;max-width:560px}td small{display:block;margin-top:5px;overflow-wrap:anywhere}.rowbutton{border:0;padding:0;text-align:left;background:none;color:var(--blue);font-weight:650}.pagination{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 0}.hint{font-size:15px;color:var(--muted);margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}.metrics>div{background:var(--bg);padding:16px;border-radius:8px}.metrics strong{display:block;font-size:36px;line-height:1.2}.metrics span{font-size:15px}.lane{border-top:4px solid var(--blue)}.lane.ai{border-top-color:#7657c7}.keyline{padding:14px 18px;background:#edf4ff;border-left:4px solid var(--blue);font-size:18px;margin:22px 0}.matrix td:not(:first-child),.matrix th:not(:first-child){text-align:center}.flow{display:grid;grid-template-columns:1fr 44px 1.6fr 44px 1fr;align-items:stretch;gap:12px;margin:36px 0}.flowcard{padding:30px 24px;background:#fff;border:1px solid var(--line);border-radius:12px}.flowcard.ai{background:#edf3ff;border-color:#9db6f2}.flowcard h2{font-size:30px;margin-bottom:18px}.flowcard p{font-size:22px;line-height:1.6}.arrow{align-self:center;text-align:center;font-size:40px;color:var(--blue)}.flowlabel{font-size:16px;font-weight:700;color:var(--blue);margin-bottom:15px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions button{text-align:left;padding:18px;font-size:22px}.actions small{font-size:16px;display:block}.skill{margin-top:26px;border-left:5px solid var(--blue);padding:22px 28px;background:white}.skill h2{font-size:30px}.skill p{font-size:23px}.skill pre{font:17px/1.7 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;background:var(--bg)}summary{cursor:pointer;font-size:20px;font-weight:650;padding:12px 0}.pill{font-size:14px;border-radius:5px;background:#fff4d8;color:#865400;padding:4px 8px}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px}.notes{font-size:20px;padding:22px;background:#fff7e0;margin-top:20px}dialog{max-width:850px;width:90%;max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:32px;color:var(--ink)}dialog::backdrop{background:#17283e77}dialog h2{padding-right:40px}dialog p{overflow-wrap:anywhere}dialog .close{float:right}dialog pre{white-space:pre-wrap;overflow-wrap:anywhere;font:16px/1.6 Consolas,monospace;background:var(--bg);padding:18px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1000px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.flowcard{padding:22px}.metrics{gap:8px}main{padding:24px 20px}}@media(max-width:600px){h1{font-size:32px}.severitygrid{grid-template-columns:repeat(3,1fr)}.metrics{grid-template-columns:1fr}.actions{grid-template-columns:1fr}nav button{font-size:15px;padding:8px}.panel{padding:18px}.toolbar input{min-width:150px}.footer{flex-wrap:wrap}.total{font-size:32px}}

<style>/*__STORY_CSS__*/</style></head><body><header><div class="brand"><span class="course">SEC545</span><span class="bname">AI Security Lab</span></div><nav aria-label="Dashboard sections"></nav><button id="full">Fullscreen</button></header><main id="stage"></main><dialog id="detail"><button class="close" onclick="this.closest('dialog').close()">Close ×</button><div id="detailbody"></div></dialog>
<script>const BENCH=/*__BENCH__*/{};const LOGOS=/*__LOGOS__*/{};const SHOTS=/*__SHOTS__*/{};
/*__STORY_JS__*/</script>
<script>
const DATA=/*__DATA__*/{};
const runs=DATA.runs||[],names={snackoverflow:'SnackOverflow',ragnarok:'RAGnarok'},DEEP=STORY.chapters.length,chapters=[...STORY.chapters,...STORY.deep.chapters],hashes=[...STORY.hashes,...STORY.deep.hashes];
const levels=['critical','high','medium','low','info','unknown'],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=n=>Number(n||0).toLocaleString(),money=n=>'$'+Number(n||0).toFixed(2),sev=s=>levels.includes(String(s).toLowerCase())?String(s).toLowerCase():'unknown',badge=s=>`<span class="badge" style="--color:var(--${sev(s)})"><i class="dot"></i>${sev(s)}</span>`;
const baselines=Object.keys(names).map(a=>runs.find(r=>r.app===a&&r.run_id==='run-01')||runs.find(r=>r.app===a)).filter(Boolean),scannerRows=baselines.flatMap(r=>(r.scanner_findings||[]).map(f=>({...f,app:r.app})));
let page=Math.max(0,hashes.indexOf(location.hash.slice(1))),app='all',severity='all',tool='all',query='',offset=0,profile='cheap',origin='all',status='all',notes=false,skill='triage';const pageSize=12;
const profiles=[...new Set(runs.map(r=>r.meta.profile))],profileName=p=>p==='cheap'?'Haiku + Sonnet':p==='opus'?'Opus':p;
const selected=()=>Object.keys(names).filter(a=>app==='all'||a===app).map(a=>runs.filter(r=>r.complete&&r.app===a&&r.meta.profile===profile).at(-1)).filter(Boolean);
const aiRows=()=>selected().flatMap(r=>r.bundle.findings.map(f=>({...f,app:r.app,run:r.run_id})));
const counts=rows=>Object.fromEntries(levels.map(s=>[s,rows.filter(f=>sev(f.severity)===s).length]));
const count=(rows,fn)=>rows.filter(fn).length;
function select(id,options,value){return `<select id="${id}" aria-label="${id}">${options.map(([v,t])=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(t)}</option>`).join('')}</select>`}
function appSelect(){return select('app',[['all','Both applications'],...Object.entries(names)],app)}
function severitySummary(rows,a){const c=counts(rows);return `<div class="stack" aria-label="Severity distribution">${levels.map(s=>c[s]?`<div style="background:var(--${s});width:${100*c[s]/rows.length}%" title="${s}: ${c[s]}"></div>`:'').join('')}</div><div class="severitygrid">${levels.map(s=>`<button data-app="${a}" data-severity="${s}" aria-label="${names[a]} ${s} findings"><strong style="color:var(--${s})">${num(c[s])}</strong>${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div>`}
function scanners(){return `<h1>Scanner findings</h1><p class="lead">Explore every finding, by application and severity.</p><div class="grid">${baselines.map(r=>{const fs=scannerRows.filter(f=>f.app===r.app),unique=new Set(fs.map(f=>f.rule_id).filter(x=>/^CVE-/.test(x))).size;return `<section class="panel"><div class="panelhead"><div><h2>${names[r.app]}</h2><span class="muted">${r.app==='snackoverflow'?'Python / FastAPI':'TypeScript / Express'}</span></div><div><div class="total">${num(fs.length)}</div><small>retained findings</small></div></div>${severitySummary(fs,r.app)}<p class="hint">${num(unique)} distinct CVE IDs · ${Object.entries(r.stats).map(([k,v])=>`${k}: ${v.imported} retained`).join(' · ')}</p></section>`}).join('')}</div><section class="section"><h2>All scanner findings</h2><p class="hint">One row per normalized finding. The same CVE can affect multiple packages or locations. Severity is reported by the scanner.</p><div class="toolbar"><input id="search" aria-label="Search findings" placeholder="Search CVE, package, finding or file" value="${esc(query)}">${appSelect()}${select('severity',[['all','All severities'],...levels.map(s=>[s,s])],severity)}${select('tool',[['all','All scanners'],['trivy','Trivy'],['semgrep','Semgrep'],['trufflehog','TruffleHog']],tool)}<button id="reset">Reset</button></div><div id="rows"></div></section>`}
function tally(rows,label,predicate){return `<div><strong>${num(count(rows,predicate))}</strong><span>${label}</span></div>`}
function ai(){const rows=aiRows(),sc=rows.filter(f=>f.origin==='scanner'),fresh=rows.filter(f=>f.origin==='ai');return `<h1>What did AI change?</h1><p class="lead">Review the scanner backlog. Discover new issues. Validate the evidence.</p><div class="toolbar">${select('profile',profiles.map(p=>[p,profileName(p)]),profile)}${appSelect()}</div><p class="hint">Completed runs: ${selected().map(r=>names[r.app]+' / '+r.run_id).join(' · ')||'None'}${selected().length<(app==='all'?2:1)?' · Some selected apps have no completed run for this profile.':''}</p><div class="grid"><section class="panel lane"><h2>1. AI reviewed scanner claims</h2><p class="muted">${sc.length} grouped review items, created from the scanner findings.</p><div class="metrics">${tally(sc,'Confirmed by triage',f=>f.verdict==='confirmed')}${tally(sc,'Not actionable',f=>f.verdict==='not_actionable')}${tally(sc,'Need review',f=>f.verdict==='needs_review')}</div><p><b>${count(sc,f=>f.validation==='yes')}</b> survived validation · <b>${count(sc,f=>f.poc==='passed')}</b> passed a live PoC</p></section><section class="panel lane ai"><h2>2. AI discovered new issues</h2><p class="muted">${fresh.length} new candidates raised by the discovery phase.</p><div class="metrics">${tally(fresh,'New candidates',()=>true)}${tally(fresh,'Survived validation',f=>f.validation==='yes')}${tally(fresh,'Passed a live PoC',f=>f.poc==='passed')}</div><p><b>${count(fresh,f=>f.validation==='no')}</b> rejected · <b>${count(fresh,f=>f.validation!=='yes'&&f.validation!=='no')}</b> uncertain / unvalidated</p></section></div><section class="section"><h2>Compare severity</h2><p class="hint">Scanner columns count grouped claims, not raw CVEs. “After triage” keeps confirmed claims at their original scanner severity. New AI candidates use the assessed severity where available, otherwise the proposed severity. Live proof is a subset.</p><div class="tablebox"><table class="matrix"><thead><tr><th>Severity</th><th>Scanner claims<br>before AI</th><th>Scanner claims<br>after triage</th><th>New AI<br>candidates</th><th>AI candidates<br>validated</th><th>Live PoCs<br>scanner + new</th></tr></thead><tbody>${levels.map(s=>`<tr><td>${badge(s)}</td><td>${count(sc,f=>sev(f.scanner_sev)===s)}</td><td>${count(sc,f=>f.verdict==='confirmed'&&sev(f.scanner_sev)===s)}</td><td>${count(fresh,f=>sev(f.sev)===s)}</td><td>${count(fresh,f=>f.validation==='yes'&&sev(f.sev)===s)}</td><td>${count(rows,f=>f.poc==='passed'&&sev(f.origin==='scanner'?f.scanner_sev:f.sev)===s)}</td></tr>`).join('')}</tbody></table></div></section><section class="section"><h2>Inspect AI decisions</h2><div class="toolbar"><input id="search" aria-label="Search findings" placeholder="Search finding or file" value="${esc(query)}">${select('origin',[['all','Scanner + AI discoveries'],['scanner','Scanner claims'],['ai','AI discoveries']],origin)}${select('status',[['all','All outcomes'],['confirmed','Triage confirmed'],['not_actionable','Not actionable'],['needs_review','Needs review'],['validated','Survived validation'],['live','Live PoC passed']],status)}${select('severity',[['all','All severities'],...levels.map(s=>[s,s])],severity)}<button id="reset">Reset</button></div><div id="rows"></div></section>`}
function comparison(){return `<h1>Compare model runs</h1><p class="lead">Coverage, proof and cost for the same training applications.</p><div class="tablebox"><table><thead><tr><th>Application / run</th><th>Models</th><th>Scanner matches</th><th>Harness matches</th><th>Live-proven bugs</th><th>Cost</th><th>Status</th></tr></thead><tbody>${runs.map(r=>{const m=r.bundle?.score.metrics;return `<tr><td>${names[r.app]}<small>${r.run_id}</small></td><td>${profileName(r.meta.profile)}</td><td>${m?m.scanner_found+' / '+m.planted:'—'}</td><td>${m?m.harness_found+' / '+m.planted:'—'}</td><td>${m?m.proved_live:'—'}</td><td>${money(r.meta.total_cost_usd)}${!m?' so far':''}</td><td>${m?'Scored':'Incomplete'}</td></tr>`}).join('')}</tbody></table></div><p class="keyline">This table counts planted bugs matched to the answer key. The AI review page counts claims and candidates. Those are different units.</p><details><summary>Phase models, tokens, timing and cost</summary>${runs.map(r=>`<h3>${names[r.app]} / ${r.run_id}</h3><div class="tablebox"><table><thead><tr><th>Phase</th><th>Model</th><th>Input tokens</th><th>Output tokens</th><th>Seconds</th><th>Cost</th></tr></thead><tbody>${Object.entries(r.meta.phases).map(([k,v])=>`<tr><td>${k}</td><td>${v.model||'—'}</td><td>${num(v.input_tokens)}</td><td>${num(v.output_tokens)}</td><td>${Math.round(v.duration_s||0)}</td><td>${money(v.cost_usd)}</td></tr>`).join('')}</tbody></table></div>`).join('')}</details>`}
const skills={triage:['Triage','Which scanner claims hold up?','Input: grouped scanner claims. Output: confirmed, not actionable, or needs review.'],discovery:['Discover','What did the scanners miss?','Input: application source and known findings. Output: new candidates with source-to-sink evidence.'],validation:['Validate','Does the issue survive scrutiny?','Input: candidates and evidence. Output: yes, no, or uncertain, plus local PoC outcomes.'],'attack-path':['Connect','How can findings combine?','Input: validated findings. Output: supported attack paths and severity decisions.']};
function harness(){const s=skills[skill];return `<h1>From scanner output to tested findings</h1><p class="lead">Follow the data through the harness. Click an AI step to see its job.</p><div class="flow"><section class="flowcard"><div class="flowlabel">01 / SCANNERS</div><h2>Collect & organize</h2><p>Trivy<br>Semgrep<br>TruffleHog</p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><p>Findings → deduplicate → grouped review queue</p></section><div class="arrow" aria-hidden="true">→</div><section class="flowcard ai"><div class="flowlabel">02 / AI WORK</div><h2>Review & investigate</h2><div class="actions">${Object.entries(skills).map(([k,s])=>`<button data-skill="${k}" aria-pressed="${k===skill}" style="${k===skill?'border:2px solid var(--blue)':''}">${s[0]}<small>${s[1]}</small></button>`).join('')}</div></section><div class="arrow" aria-hidden="true">→</div><section class="flowcard"><div class="flowlabel">03 / RESULTS</div><h2>Evidence & decisions</h2><p>Reviewed claims<br>New findings<br>Live PoC results<br>Attack paths</p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><p>Score against the hidden answer key</p></section></div><section class="skill"><h2>${s[0]}: ${s[1]}</h2><p>${s[2]}</p><details><summary>Read the actual skill instructions</summary><pre>${esc(DATA.skills[skill])}</pre></details></section><p class="keyline">The AI reads a blind copy of the application. The harness runs local PoCs. The answer key is used only afterward for scoring.</p>`}
let displayed=[];
function renderRows(){let rows=page===0?scannerRows:aiRows();rows=rows.filter(f=>(page!==0||app==='all'||f.app===app)&&(severity==='all'||sev(page===0?f.severity:f.origin==='scanner'?f.scanner_sev:f.sev)===severity)&&(page!==0||tool==='all'||f.tool.startsWith(tool))&&(page!==1||origin==='all'||f.origin===origin)&&(page!==1||status==='all'||(status==='validated'?f.validation==='yes':status==='live'?f.poc==='passed':f.verdict===status))&&JSON.stringify(f).toLowerCase().includes(query.toLowerCase()));rows.sort((a,b)=>levels.indexOf(sev(page===0?a.severity:a.origin==='scanner'?a.scanner_sev:a.sev))-levels.indexOf(sev(page===0?b.severity:b.origin==='scanner'?b.scanner_sev:b.sev)));offset=Math.min(offset,Math.max(0,Math.ceil(rows.length/pageSize)-1));displayed=rows.slice(offset*pageSize,(offset+1)*pageSize);document.getElementById('rows').innerHTML=`<div class="tablebox"><table><thead><tr>${(page===0?['Severity','CVE / finding','Package / version','Application','Scanner']:['Severity','Finding','Application / source','Triage / validation','Live PoC']).map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${displayed.map((f,i)=>page===0?`<tr><td>${badge(f.severity)}</td><td class="title"><button class="rowbutton" data-detail="${i}">${esc(f.rule_id)}</button><div>${esc(f.title)}</div><small>${esc(f.file)}${f.line?':'+f.line:''}</small></td><td>${esc(f.package?.name||'—')}<small>${esc(f.package?.installed||'')}${f.package?.fixed?'<br>Fixed: '+esc(f.package.fixed):''}</small></td><td>${names[f.app]}</td><td>${esc(f.tool)}</td></tr>`:`<tr><td>${badge(f.origin==='scanner'?f.scanner_sev:f.sev)}</td><td class="title"><button class="rowbutton" data-detail="${i}">${esc(f.title)}</button><small>${esc(f.loc)}</small></td><td>${names[f.app]}<small>${f.origin==='ai'?'AI discovery':'Scanner claim'} · ${esc(f.id)}</small></td><td>${f.origin==='scanner'?esc(f.verdict).replaceAll('_',' '):'New candidate'}<small>Validation: ${esc(f.validation||'not assessed')}</small></td><td>${esc(f.poc||'not run')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No findings match these filters.</td></tr>'}</tbody></table></div><div class="pagination"><span>${rows.length?offset*pageSize+1:0}–${Math.min((offset+1)*pageSize,rows.length)} of ${num(rows.length)} findings</span><div><button id="previousRows" ${offset===0?'disabled':''}>Previous</button> <button id="nextRows" ${(offset+1)*pageSize>=rows.length?'disabled':''}>Next</button></div></div>`;document.getElementById('previousRows').onclick=()=>{offset--;renderRows()};document.getElementById('nextRows').onclick=()=>{offset++;renderRows()};document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(displayed[+b.dataset.detail]));}
function detail(f){document.getElementById('detailbody').innerHTML=`<h2>${esc(f.title)}</h2><p>${names[f.app]} · ${esc(f.id)}</p>${page===0?`<p>${badge(f.severity)} · ${esc(f.tool)}</p><p><b>Rule / CVE:</b> ${esc(f.rule_id)}</p><p><b>Location:</b> ${esc(f.file)}:${f.line||'—'}</p><p><b>Package:</b> ${esc(f.package?.name||'Not applicable')} ${esc(f.package?.installed||'')}</p><p><b>Fixed version:</b> ${esc(f.package?.fixed||'Not recorded')}</p><p><b>CWE:</b> ${esc((f.cwe||[]).join(', '))}</p>`:`<p><b>Source:</b> ${f.origin==='ai'?'AI discovery':'Scanner claim'}</p><p><b>Reasoning:</b> ${esc(f.why)}</p><p><b>Validation:</b> ${esc(f.validation||'not assessed')} · <b>Live PoC:</b> ${esc(f.poc||'not run')}</p><p>${esc(f.evidence||'')}</p>${f.flip?'<p><b>Unresolved fact:</b> '+esc(f.flip)+'</p>':''}<p>${esc(f.loc)}</p>${f.poc_desc?'<p>'+esc(f.poc_desc)+'</p>':''}`}`;document.getElementById('detail').showModal()}
const speaker=['Start with actual scanner results. Click a severity total, search a CVE, and inspect the package and affected file. These are retained findings, not claims reviewed by AI.','Scanner findings are grouped before triage. Walk through the two lanes separately. A triage confirmation, validation survival and passed live PoC are different stages. The table keeps the units consistent.','Compare completed runs only. Incomplete results are unavailable, not zero. These planted targets do not establish a universal model ranking.','Follow left to right: scanners collect the inputs; AI reviews and investigates; the harness records evidence and scores results. Open the actual skill instructions for a deeper look.'];
function render(){document.body.dataset.mode='story';document.body.dataset.deep=page>=DEEP?'1':'';document.querySelector('nav').innerHTML=`<button class="navarrow" data-page="${Math.max(0,page-1)}" aria-label="Previous page" ${page===0?'disabled':''}>‹</button>`+chapters.slice(0,DEEP).map((n,i)=>`<button class="dotstep${i===page?' on':''}${i<page?' done':''}" data-page="${i}" title="${i+1}. ${n}" ${i===page?'aria-current="page"':''}><span class="dn">${i+1}</span>${i===page?`<span class="dl">${n}</span>`:''}</button>`).join('')+`<button class="navarrow" data-page="${Math.min(DEEP-1,page+1)}" aria-label="Next page" ${page>=DEEP-1?'disabled':''}>›</button>`+`<details class="deepmenu"${page>=DEEP?' data-active':''}><summary>Deep dive ▾</summary><div class="dd">${chapters.slice(DEEP).map((n,k)=>`<button data-page="${DEEP+k}" ${DEEP+k===page?'aria-current="page"':''}>${n}</button>`).join('')}</div></details>`;document.getElementById('stage').innerHTML=[...STORY.views,...STORY.deep.views][page]()+`<div class="footer"><button id="back" ${page===0?'disabled':''}>← Previous section</button><button id="notes">${notes?'Hide':'Show'} speaker notes</button><button id="forward">${page===chapters.length-1?'Back to start':'Next: '+chapters[page+1]} →</button></div>${notes?'<aside class="notes">'+(STORY.notes[page]||'Detail view for questions. Not part of the 10-minute story.')+'</aside>':''}`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(+b.dataset.page));if(window.fitStage){requestAnimationFrame(fitStage);setTimeout(fitStage,120);}document.getElementById('back').onclick=()=>go(page-1);document.getElementById('forward').onclick=()=>go((page+1)%chapters.length);document.getElementById('notes').onclick=()=>{notes=!notes;render()};document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{skill=b.dataset.skill;render()});document.querySelectorAll('[data-severity]').forEach(b=>b.onclick=()=>{app=b.dataset.app;severity=b.dataset.severity;offset=0;render();document.querySelector('.section').scrollIntoView({behavior:'smooth'})});if(false){renderRows();document.getElementById('search').oninput=e=>{query=e.target.value;offset=0;renderRows()};for(const id of ['app','severity','tool','profile','origin','status']){const el=document.getElementById(id);if(el)el.onchange=()=>{const v=el.value;if(id==='app')app=v;if(id==='severity')severity=v;if(id==='tool')tool=v;if(id==='profile')profile=v;if(id==='origin')origin=v;if(id==='status')status=v;offset=0;render()}}document.getElementById('reset').onclick=()=>{app='all';severity=tool=origin=status='all';query='';offset=0;render()}}}
function go(n){page=Math.max(0,Math.min(chapters.length-1,n));query='';severity=tool=origin=status='all';offset=0;location.hash=hashes[page];render();window.scrollTo(0,0)}window.onhashchange=()=>{page=Math.max(0,hashes.indexOf(location.hash.slice(1)));render()};document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.getElementById('full').textContent='Use F11'}};document.addEventListener('keydown',e=>{if(/INPUT|SELECT|BUTTON|TEXTAREA/.test(e.target.tagName)||document.getElementById('detail').open)return;if(e.key==='ArrowRight')go(Math.min(chapters.length-1,page+1));if(e.key==='ArrowLeft')go(page-1)});render();
</script></body></html>
